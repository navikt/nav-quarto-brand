name: Bygg eksempelprosjekt

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Bygg HTML
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html
